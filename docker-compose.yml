name: tusumba

x-service-env: &service-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-migrate: &migrate
  logging: *logging
  command: ["alembic", "upgrade", "head"]
  pull_policy: never
  restart: "no"
  depends_on:
    postgres:
      condition: service_healthy

x-service: &service
  restart: unless-stopped
  logging: *logging
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    start_period: 15s
    retries: 5
  depends_on: &service-deps
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: tusumba
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      EVENTS_DB_PASSWORD: ${EVENTS_DB_PASSWORD:?}
      TICKETING_DB_PASSWORD: ${TICKETING_DB_PASSWORD:?}
      MODERATION_DB_PASSWORD: ${MODERATION_DB_PASSWORD:?}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d tusumba"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *logging
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-migrate:
    <<: *migrate
    image: tusumba/identity-service:local
    environment: &identity-env
      <<: *service-env
      SERVICE_NAME: identity
      DATABASE_URL: postgresql+asyncpg://identity:${IDENTITY_DB_PASSWORD:?}@postgres:5432/tusumba

  identity:
    <<: *service
    build: ../identity-service
    image: tusumba/identity-service:local
    environment: *identity-env
    depends_on:
      <<: *service-deps
      identity-migrate:
        condition: service_completed_successfully

  events-migrate:
    <<: *migrate
    image: tusumba/events-service:local
    environment: &events-env
      <<: *service-env
      SERVICE_NAME: events
      DATABASE_URL: postgresql+asyncpg://events:${EVENTS_DB_PASSWORD:?}@postgres:5432/tusumba

  events:
    <<: *service
    build: ../events-service
    image: tusumba/events-service:local
    environment: *events-env
    depends_on:
      <<: *service-deps
      events-migrate:
        condition: service_completed_successfully

  ticketing-migrate:
    <<: *migrate
    image: tusumba/ticketing-service:local
    environment: &ticketing-env
      <<: *service-env
      SERVICE_NAME: ticketing
      DATABASE_URL: postgresql+asyncpg://ticketing:${TICKETING_DB_PASSWORD:?}@postgres:5432/tusumba

  ticketing:
    <<: *service
    build: ../ticketing-service
    image: tusumba/ticketing-service:local
    environment: *ticketing-env
    depends_on:
      <<: *service-deps
      ticketing-migrate:
        condition: service_completed_successfully

  moderation-migrate:
    <<: *migrate
    image: tusumba/moderation-service:local
    environment: &moderation-env
      <<: *service-env
      SERVICE_NAME: moderation
      DATABASE_URL: postgresql+asyncpg://moderation:${MODERATION_DB_PASSWORD:?}@postgres:5432/tusumba

  moderation:
    <<: *service
    build: ../moderation-service
    image: tusumba/moderation-service:local
    environment: *moderation-env
    depends_on:
      <<: *service-deps
      moderation-migrate:
        condition: service_completed_successfully

  notifications-migrate:
    <<: *migrate
    image: tusumba/notifications-service:local
    environment: &notifications-env
      <<: *service-env
      SERVICE_NAME: notifications
      DATABASE_URL: postgresql+asyncpg://notifications:${NOTIFICATIONS_DB_PASSWORD:?}@postgres:5432/tusumba

  notifications:
    <<: *service
    build: ../notifications-service
    image: tusumba/notifications-service:local
    environment: *notifications-env
    depends_on:
      <<: *service-deps
      notifications-migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${OPS_PORT:-8081}:8081"
    environment:
      OPS_USER: ${OPS_USER:?}
      OPS_PASSWORD: ${OPS_PASSWORD:?}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ops.conf:/etc/nginx/conf.d/ops.conf:ro
      - ./nginx/ops-htpasswd.sh:/docker-entrypoint.d/40-ops-htpasswd.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  gatus:
    image: twinproduction/gatus:v5.37.0
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - gatus-data:/data

  dozzle:
    image: amir20/dozzle:v11.3.5
    restart: unless-stopped
    logging: *logging
    environment:
      DOZZLE_BASE: /logs
      DOZZLE_FILTER: label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_RELEASE_CHECK_MODE: manual
      DOZZLE_IMAGE_CHECK_MODE: "off"
      DOZZLE_DISABLE_SETUP_WIZARD: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  gatus-data:
