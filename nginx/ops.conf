server {
    listen 8081;
    server_name _;

    absolute_redirect off;

    auth_basic "Tusumba";
    auth_basic_user_file /etc/nginx/ops.htpasswd;

    location = /logs {
        return 301 /logs/;
    }

    location /logs/ {
        set $dozzle dozzle;
        proxy_pass http://$dozzle:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        set $gatus gatus;
        proxy_pass http://$gatus:8080;
    }
}
