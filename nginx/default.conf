map $uri $backend {
    default "";

    ~^/v1/(auth|users|friend-requests)(/|$)                                                       identity;
    ~^/v1/me/?$                                                                                   identity;
    ~^/v1/me/(friends|invitations)(/|$)                                                           identity;
    ~^/v1/events/[^/]+/invitations(/|$)                                                           identity;

    ~^/v1/events/[^/]+/(ticket-settings|purchases|registration|participants|friends-going)(/|$)   ticketing;
    ~^/v1/events/[^/]+/stats/sales(/|$)                                                           ticketing;
    ~^/v1/(purchases|tickets)(/|$)                                                                ticketing;
    ~^/v1/me/(tickets|registrations)(/|$)                                                         ticketing;
    ~^/webhooks/payments$                                                                         ticketing;

    ~^/v1/(applications|complaints|moderation)(/|$)                                               moderation;
    ~^/v1/me/(applications|complaints)(/|$)                                                       moderation;

    ~^/v1/me/(notification-settings|devices)(/|$)                                                 notifications;

    ~^/v1/(events|clubs|team-invitations)(/|$)                                                    events;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_request_id $forwarded_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

map $service_host $service_backend {
    id            identity;
    events        events;
    ticketing     ticketing;
    moderation    moderation;
    notifications notifications;
}

resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 10m;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Request-ID $forwarded_request_id;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header Connection "";

server {
    listen 80 default_server;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /internal {
        return 404;
    }

    location / {
        if ($backend = "") {
            return 404;
        }

        proxy_pass http://$backend:8000;
    }
}

server {
    listen 80;
    server_name ~^(?<service_host>id|events|ticketing|moderation|notifications)\.;

    location ^~ /internal {
        return 404;
    }

    location / {
        proxy_pass http://$service_backend:8000;
    }
}
